                  micButton.setBackground(micBg);
                  applyMicModeBehavior(micButton);
                  toolbar.addView(micButton, new LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, dpToPx(36)));

                  GradientDrawable barBtnBg = new GradientDrawable();
