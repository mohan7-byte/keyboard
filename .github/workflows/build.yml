                  {"क", "ख", "ग", "घ", "ङ", "च", "छ", "ज", "झ", "ञ"},
                  {"ट", "ठ", "ड", "ढ", "ण", "त", "थ", "द", "ध", "न"},
                  {"SHIFT", "प", "फ", "ब", "भ", "म", "य", "र", "ल", "व", "DEL"},
                  {"123", "ा", "ि", "ी", "SPACE", "ु", "ू", "्", "ENTER"}
              };

              // Hindi Devanagari Vowels & Secondary
              private final String[][] hindiVowels = {
                  {"अ", "आ", "इ", "ई", "उ", "ऊ", "ऋ", "ए", "ऐ", "ओ", "औ"},
                  {"श", "ष", "स", "ह", "क्ष", "त्र", "ज्ञ", "श्र", "ड़", "ढ़"},
                  {"SHIFT", "े", "ै", "ो", "ौ", "ं", "ँ", "ः", "़", "DEL"},
                  {"123", "।", "?", ",", "SPACE", "!", ".", "ENTER"}
