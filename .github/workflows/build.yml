name: Build Gemini Voice Keyboard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Scaffold Complete Android Project
        run: |
          echo "Writing latest Gemini Keyboard project files..."
          mkdir -p app/src/main/java/com/gemini/keyboard
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/res/drawable
          if [ -f "icon.png" ]; then
            cp icon.png app/src/main/res/drawable/app_icon.png
          fi

          # 1. settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GeminiKeyboard"
          include ':app'
          EOF

          # 2. build.gradle (root)
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          # 3. gradle.properties
          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          # 4. app/build.gradle
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.gemini.keyboard'
              compileSdk 34

              defaultConfig {
                  applicationId "com.gemini.keyboard"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "4.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
                  debug {
                      debuggable true
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          dependencies {
              implementation 'androidx.appcompat:appcompat:1.7.0'
              implementation 'com.google.android.material:material:1.12.0'
              implementation 'com.squareup.okhttp3:okhttp:4.12.0'
          }
          EOF

          # 5. AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:label="Gemini Keyboard"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.GeminiApp">

                  <service
                      android:name=".GeminiInputMethodService"
                      android:label="Gemini Keyboard"
                      android:permission="android.permission.BIND_INPUT_METHOD"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.view.InputMethod" />
                      </intent-filter>
                      <meta-data
                          android:name="android.view.im"
                          android:resource="@xml/method" />
                  </service>

                  <activity
                      android:name=".SettingsActivity"
                      android:label="Gemini Keyboard Setup"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>

          </manifest>
          EOF

          # 6. Resources
          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Gemini Keyboard</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/values/styles.xml
          <resources>
              <style name="Theme.GeminiApp" parent="Theme.AppCompat.Light.DarkActionBar">
                  <item name="colorPrimary">#0284C7</item>
                  <item name="colorPrimaryDark">#0F172A</item>
                  <item name="colorAccent">#38BDF8</item>
              </style>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/res/xml/method.xml
          <?xml version="1.0" encoding="utf-8"?>
          <input-method xmlns:android="http://schemas.android.com/apk/res/android"
              android:settingsActivity="com.gemini.keyboard.SettingsActivity">
              <subtype
                  android:label="Gemini Keyboard"
                  android:imeSubtypeLocale="en_US"
                  android:imeSubtypeMode="keyboard" />
          </input-method>
          EOF

          # 7. SettingsActivity.java (Masked Key + Tap/Hold Setting + Clean Dark UI)
          cat << 'EOF' > app/src/main/java/com/gemini/keyboard/SettingsActivity.java
          package com.gemini.keyboard;

          import android.Manifest;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.text.InputType;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.LinearLayout;
          import android.widget.RadioButton;
          import android.widget.RadioGroup;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;

          public class SettingsActivity extends AppCompatActivity {
              private static final int REQ_MIC = 200;
              private EditText apiKeyEdit;
              private EditText modelEdit;
              private EditText triggerWordEdit;
              private RadioGroup micModeGroup;
              private RadioButton rbTap;
              private RadioButton rbHold;
              private boolean isKeyVisible = false;
              private SharedPreferences prefs;

              private int dpToPx(int dp) {
                  return (int) (dp * getResources().getDisplayMetrics().density);
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  if (getSupportActionBar() != null) {
                      getSupportActionBar().setTitle("Gemini Keyboard");
                      getSupportActionBar().setElevation(0);
                  }

                  prefs = getSharedPreferences("gemini_prefs", MODE_PRIVATE);

                  ScrollView scrollView = new ScrollView(this);
                  scrollView.setBackgroundColor(Color.parseColor("#09090B"));

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(dpToPx(16), dpToPx(16), dpToPx(16), dpToPx(24));

                  // --- Header ---
                  LinearLayout headerCard = createCard();
                  TextView title = new TextView(this);
                  title.setText("✨ Gemini Voice Keyboard");
                  title.setTextSize(TypedValue.COMPLEX_UNIT_SP, 20);
                  title.setTextColor(Color.WHITE);
                  title.setTypeface(null, android.graphics.Typeface.BOLD);
                  headerCard.addView(title);

                  TextView subtitle = new TextView(this);
                  subtitle.setText("Real-time streaming, Hindi Devanagari, voice actions, and clipboard vault.");
                  subtitle.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  subtitle.setTextColor(Color.parseColor("#A1A1AA"));
                  subtitle.setPadding(0, dpToPx(6), 0, 0);
                  headerCard.addView(subtitle);
                  root.addView(headerCard);

                  // --- AI Engine Card ---
                  LinearLayout aiCard = createCard();
                  aiCard.addView(createSectionTitle("AI & Voice Engine"));

                  // 1. API Key with Eye Toggle
                  aiCard.addView(createFieldLabel("Google AI Studio API Key (Protected)"));
                  LinearLayout keyRow = new LinearLayout(this);
                  keyRow.setOrientation(LinearLayout.HORIZONTAL);
                  keyRow.setGravity(Gravity.CENTER_VERTICAL);

                  apiKeyEdit = createStyledInput("Paste API Key");
                  apiKeyEdit.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  apiKeyEdit.setText(prefs.getString("api_key", ""));
                  keyRow.addView(apiKeyEdit, new LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.0f));

                  Button eyeBtn = new Button(this);
                  eyeBtn.setText("👁️");
                  eyeBtn.setTextColor(Color.WHITE);
                  GradientDrawable eyeBg = new GradientDrawable();
                  eyeBg.setColor(Color.parseColor("#27272A"));
                  eyeBg.setCornerRadius(dpToPx(8));
                  eyeBtn.setBackground(eyeBg);
                  LinearLayout.LayoutParams eyeLp = new LinearLayout.LayoutParams(dpToPx(44), dpToPx(44));
                  eyeLp.leftMargin = dpToPx(6);
                  eyeBtn.setLayoutParams(eyeLp);
                  eyeBtn.setOnClickListener(v -> {
                      isKeyVisible = !isKeyVisible;
                      if (isKeyVisible) {
                          apiKeyEdit.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_VISIBLE_PASSWORD);
                          eyeBtn.setText("🙈");
                      } else {
                          apiKeyEdit.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                          eyeBtn.setText("👁️");
                      }
                      apiKeyEdit.setSelection(apiKeyEdit.getText().length());
                  });
                  keyRow.addView(eyeBtn);
                  aiCard.addView(keyRow);

                  // 2. Model Name
                  aiCard.addView(createFieldLabel("Gemini Model"));
                  modelEdit = createStyledInput("e.g. gemini-2.0-flash");
                  modelEdit.setText(prefs.getString("model_name", "gemini-2.0-flash"));
                  aiCard.addView(modelEdit);

                  // 3. Trigger Word
                  aiCard.addView(createFieldLabel("Action Trigger Word"));
                  triggerWordEdit = createStyledInput("e.g. Gemini or Jarvis");
                  triggerWordEdit.setText(prefs.getString("trigger_word", "Gemini"));
                  aiCard.addView(triggerWordEdit);

                  // 4. Mic Behavior (Tap vs Hold)
                  aiCard.addView(createFieldLabel("Microphone Button Mode"));
                  micModeGroup = new RadioGroup(this);
                  micModeGroup.setOrientation(LinearLayout.VERTICAL);

                  rbTap = new RadioButton(this);
                  rbTap.setText("Tap to Talk (Click once to speak, click to finish)");
                  rbTap.setTextColor(Color.WHITE);
                  rbTap.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  micModeGroup.addView(rbTap);

                  rbHold = new RadioButton(this);
                  rbHold.setText("Hold to Talk (Press & hold while speaking)");
                  rbHold.setTextColor(Color.WHITE);
                  rbHold.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  micModeGroup.addView(rbHold);

                  String currentMode = prefs.getString("mic_mode", "tap");
                  if (currentMode.equals("hold")) rbHold.setChecked(true);
                  else rbTap.setChecked(true);

                  aiCard.addView(micModeGroup);

                  // Save Button
                  Button saveBtn = new Button(this);
                  saveBtn.setText("💾 Save Configuration");
                  saveBtn.setTextColor(Color.WHITE);
                  saveBtn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 14);
                  GradientDrawable saveBg = new GradientDrawable();
                  saveBg.setColor(Color.parseColor("#0284C7"));
                  saveBg.setCornerRadius(dpToPx(8));
                  saveBtn.setBackground(saveBg);
                  LinearLayout.LayoutParams saveLp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dpToPx(46));
                  saveLp.setMargins(0, dpToPx(16), 0, dpToPx(4));
                  saveBtn.setLayoutParams(saveLp);
                  saveBtn.setOnClickListener(v -> {
                      String selectedMicMode = rbHold.isChecked() ? "hold" : "tap";
                      prefs.edit()
                          .putString("api_key", apiKeyEdit.getText().toString().trim())
                          .putString("model_name", modelEdit.getText().toString().trim())
                          .putString("trigger_word", triggerWordEdit.getText().toString().trim())
                          .putString("mic_mode", selectedMicMode)
                          .apply();
                      Toast.makeText(this, "Settings saved!", Toast.LENGTH_SHORT).show();
                  });
                  aiCard.addView(saveBtn);
                  root.addView(aiCard);

                  // --- Setup Steps Card ---
                  LinearLayout stepsCard = createCard();
                  stepsCard.addView(createSectionTitle("System Setup"));

                  stepsCard.addView(createStepButton("1. Grant Microphone Permission", v -> {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, REQ_MIC);
                      } else {
                          Toast.makeText(this, "Microphone permission is already granted!", Toast.LENGTH_SHORT).show();
                      }
                  }));

                  stepsCard.addView(createStepButton("2. Enable in System Keyboards", v -> {
                      startActivity(new Intent(Settings.ACTION_INPUT_METHOD_SETTINGS));
                  }));

                  stepsCard.addView(createStepButton("3. Select Active Keyboard", v -> {
                      InputMethodManager imm = (InputMethodManager) getSystemService(Context.INPUT_METHOD_SERVICE);
                      if (imm != null) imm.showInputMethodPicker();
                  }));

                  root.addView(stepsCard);

                  scrollView.addView(root);
                  setContentView(scrollView);
              }

              private LinearLayout createCard() {
                  LinearLayout card = new LinearLayout(this);
                  card.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#18181B"));
                  bg.setCornerRadius(dpToPx(12));
                  bg.setStroke(dpToPx(1), Color.parseColor("#27272A"));
                  card.setBackground(bg);
                  card.setPadding(dpToPx(16), dpToPx(16), dpToPx(16), dpToPx(16));
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT);
                  lp.setMargins(0, 0, 0, dpToPx(16));
                  card.setLayoutParams(lp);
                  return card;
              }

              private TextView createSectionTitle(String title) {
                  TextView tv = new TextView(this);
                  tv.setText(title);
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 15);
                  tv.setTextColor(Color.WHITE);
                  tv.setTypeface(null, android.graphics.Typeface.BOLD);
                  tv.setPadding(0, 0, 0, dpToPx(10));
                  return tv;
              }

              private TextView createFieldLabel(String label) {
                  TextView tv = new TextView(this);
                  tv.setText(label);
                  tv.setTextSize(TypedValue.COMPLEX_UNIT_SP, 12);
                  tv.setTextColor(Color.parseColor("#D4D4D8"));
                  tv.setTypeface(null, android.graphics.Typeface.BOLD);
                  tv.setPadding(0, dpToPx(10), 0, dpToPx(4));
                  return tv;
              }

              private EditText createStyledInput(String hint) {
                  EditText et = new EditText(this);
                  et.setHint(hint);
                  et.setHintTextColor(Color.parseColor("#52525B"));
                  et.setTextColor(Color.WHITE);
                  et.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  GradientDrawable inputBg = new GradientDrawable();
                  inputBg.setColor(Color.parseColor("#27272A"));
                  inputBg.setCornerRadius(dpToPx(8));
                  et.setBackground(inputBg);
                  et.setPadding(dpToPx(12), dpToPx(10), dpToPx(12), dpToPx(10));
                  return et;
              }

              private Button createStepButton(String text, View.OnClickListener listener) {
                  Button btn = new Button(this);
                  btn.setText(text);
                  btn.setTextColor(Color.parseColor("#E4E4E7"));
                  btn.setTextSize(TypedValue.COMPLEX_UNIT_SP, 13);
                  btn.setAllCaps(false);
                  GradientDrawable bg = new GradientDrawable();
                  bg.setColor(Color.parseColor("#27272A"));
                  bg.setCornerRadius(dpToPx(8));
                  btn.setBackground(bg);
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, dpToPx(42));
                  lp.setMargins(0, dpToPx(6), 0, dpToPx(4));
                  btn.setLayoutParams(lp);
                  btn.setOnClickListener(listener);
                  return btn;
              }
          }
          EOF

          # 8. GeminiInputMethodService.java (Real-Time SSE Streaming + Hindi Layout + Clipboard Manager + Voice AI)
          cat << 'EOF' > app/src/main/java/com/gemini/keyboard/GeminiInputMethodService.java
          package com.gemini.keyboard;

          import android.Manifest;
          import android.content.ClipData;
          import android.content.ClipboardManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.graphics.drawable.GradientDrawable;
          import android.inputmethodservice.InputMethodService;
          import android.media.MediaRecorder;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import android.text.TextUtils;
          import android.util.Base64;
          import android.util.TypedValue;
          import android.view.Gravity;
          import android.view.KeyEvent;
          import android.view.MotionEvent;
          import android.view.View;
          import android.view.ViewGroup;
          import android.view.inputmethod.InputConnection;
          import android.view.inputmethod.InputMethodManager;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.HorizontalScrollView;
          import android.widget.LinearLayout;
          import android.widget.ScrollView;
          import android.widget.TextView;
          import androidx.core.content.ContextCompat;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.InputStreamReader;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.TimeUnit;

          import okhttp3.ConnectionPool;
          import okhttp3.MediaType;
          import okhttp3.OkHttpClient;
          import okhttp3.Request;
          import okhttp3.RequestBody;
          import okhttp3.Response;

          public class GeminiInputMethodService extends InputMethodService {
              private boolean isCaps = false;
              private boolean isNumberMode = false;
              private boolean isHindiMode = false;
              private boolean isRecording = false;
              private boolean isRecordingForAiPrompt = false;
              private long recordStartTime = 0;

              private LinearLayout keysContainer;
              private LinearLayout clipboardDrawer;
              private LinearLayout clipboardItemsLayout;
              private LinearLayout aiPanel;
              private EditText manualAiPromptInput;
              private Button micButton;
              private Button aiMicButton;
              private Button langToggleBtn;
              private TextView statusText;
              private Handler mainHandler;
              private MediaRecorder mediaRecorder;
              private final List<Button> letterButtons = new ArrayList<>();

              // Persistent HTTP/2 Client with Connection Pooling
              private static OkHttpClient httpClient;
              public static synchronized OkHttpClient getClient() {
                  if (httpClient == null) {
                      httpClient = new OkHttpClient.Builder()
                          .connectionPool(new ConnectionPool(5, 5, TimeUnit.MINUTES))
                          .connectTimeout(10, TimeUnit.SECONDS)
                          .readTimeout(25, TimeUnit.SECONDS)
                          .writeTimeout(15, TimeUnit.SECONDS)
                          .build();
                  }
                  return httpClient;
              }

              // English QWERTY
              private final String[][] qwertyLetters = {
                  {"q", "w", "e", "r", "t", "y", "u", "i", "o", "p"},
                  {"a", "s", "d", "f", "g", "h", "j", "k", "l"},
