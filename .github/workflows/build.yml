              // --- Microphone Mode (Tap vs Hold) ---
              private void applyMicModeBehavior(Button btn) {
                  SharedPreferences prefs = getSharedPreferences("gemini_prefs", MODE_PRIVATE);
                  String mode = prefs.getString("mic_mode", "tap");

                  if (mode.equals("hold")) {
                      btn.setText("🎙️ Hold");
                      btn.setOnClickListener(null);
                      btn.setOnTouchListener((v, event) -> {
                          switch (event.getAction()) {
                              case MotionEvent.ACTION_DOWN:
                                  recordStartTime = System.currentTimeMillis();
                                  startVoiceRecording(false);
                                  return true;
                              case MotionEvent.ACTION_UP:
                              case MotionEvent.ACTION_CANCEL:
                                  long duration = System.currentTimeMillis() - recordStartTime;
                                  if (duration < 350) {
                                      statusText.setText("Hold while talking");
                                      cancelVoiceRecording();
                                  } else {
                                      stopVoiceRecording(false);
                                  }
                                  return true;
                          }
                          return false;
                      });
                  } else {
                      btn.setText("🎙️ Mic");
                      btn.setOnTouchListener(null);
                      btn.setOnClickListener(v -> {
                          if (isRecording) {
                              stopVoiceRecording(false);
                          } else {
                              startVoiceRecording(false);
                          }
                      });
                  }
              }

